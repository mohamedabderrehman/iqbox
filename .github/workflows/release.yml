name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: demo
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: synthetic-ci-signing-value-for-disposable-tests
      DEMO_PASSWORD: Synthetic-Demo-2026
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: demo
      DB_PASSWORD: synthetic-ci-only
      DB_NAME: demo
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && node tools/bootstrap-demo.js
      - run: |
          node server.js > /tmp/iqbox.log 2>&1 &
          for n in $(seq 1 30); do curl -s http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          node tools/check-demo.js
      - run: npm ci && npm run build
        working-directory: admin-panel
